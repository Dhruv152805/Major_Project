
amcl:
  ros__parameters:
    use_sim_time: false

    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "scan"

    laser_model_type: "likelihood_field"
    laser_min_range: 0.15
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.5
    max_beams: 120
    sigma_hit: 0.15

    z_hit: 0.85
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.15
    lambda_short: 0.1

    max_particles: 3000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99

    resample_interval: 1

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    update_min_d: 0.10
    update_min_a: 0.10

    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    save_pose_rate: 0.5



bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: "map"
    robot_base_frame: "base_footprint"
    odom_topic: "/odom"

    bt_loop_duration: 200
    default_server_timeout: 20

    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

    goal_blackboard_id: "goal"
    path_blackboard_id: "path"
    goals_blackboard_id: "goals"


controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 5.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 5.0

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins:
      - "general_goal_checker"

    controller_plugins:
      - "FollowPath"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 60.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.10

      lookahead_dist: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.70
      lookahead_time: 1.0

      use_velocity_scaled_lookahead_dist: true

      transform_tolerance: 0.3

      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.40
      rotate_to_heading_min_angle: 0.30

      allow_reversing: true

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.05

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.2

      max_angular_accel: 1.0

      max_robot_pose_search_dist: 10.0

      use_interpolation: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: "odom"
      robot_base_frame: "base_footprint"

      rolling_window: true

      width: 3
      height: 3
      resolution: 0.05

      robot_radius: 0.15

      plugins:
        - "obstacle_layer"
        - "inflation_layer"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: "scan"

        scan:
          topic: "/scan"
          data_type: "LaserScan"

          marking: true
          clearing: true

          max_obstacle_height: 2.0

          obstacle_min_range: 0.18
          obstacle_max_range: 2.5

          raytrace_min_range: 0.15
          raytrace_max_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.30
        cost_scaling_factor: 10.0

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: "map"
      robot_base_frame: "base_footprint"

      resolution: 0.05

      robot_radius: 0.15

      rolling_window: false

      width: 10
      height: 10

      track_unknown_space: true

      plugins:
        - "static_layer"
        - "obstacle_layer"
        - "inflation_layer"

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: "scan"

        scan:
          topic: "/scan"
          data_type: "LaserScan"

          marking: true
          clearing: true

          max_obstacle_height: 2.0

          obstacle_min_range: 0.18
          obstacle_max_range: 2.5

          raytrace_min_range: 0.15
          raytrace_max_range: 4.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.30
        cost_scaling_factor: 5.0

      always_send_full_costmap: true


map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""


planner_server:
  ros__parameters:
    use_sim_time: false

    expected_planner_frequency: 5.0

    planner_plugins:
      - "GridBased"

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"

      tolerance: 0.40

      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000

      max_planning_time: 3.5

      cost_travel_multiplier: 2.0

      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000

        w_smooth: 0.3
        w_data: 0.2

        tolerance: 1.0e-10

        do_refinement: true
        refinement_num: 2


behavior_server:
  ros__parameters:
    use_sim_time: false

    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/published_footprint"

    cycle_frequency: 10.0

    behavior_plugins:
      - "spin"
      - "backup"
      - "drive_on_heading"
      - "wait"

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    global_frame: "odom"
    robot_base_frame: "base_footprint"

    transform_timeout: 0.1

    simulate_ahead_time: 2.0

    max_rotational_vel: 0.50
    min_rotational_vel: 0.20
    rotational_accel: 1.0


robot_state_publisher:
  ros__parameters:
    use_sim_time: false
